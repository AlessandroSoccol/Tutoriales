version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=tienda_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret_password

  web:
    build: .
    
    # Usamos Gunicorn en lugar de runserver
    # tienda_project debe ser la carpeta donde está wsgi.py
    command: gunicorn tienda_project.wsgi:application --bind 0.0.0.0:8000
    
    volumes:
      - .:/app
    
    depends_on:
      - db
    
    environment:
      - DB_NAME=tienda_db
      - DB_USER=postgres
      - DB_PASSWORD=secret_password
      - DB_HOST=db
      - DB_PORT=5432

    # Django no expone puertos directamente.
    # Nginx será el encargado de recibir las peticiones.

  nginx:
    image: nginx:1.25-alpine
    
    # Nginx es el único servicio expuesto a Internet
    ports:
      - "80:80"
    
    volumes:
      # Configuración personalizada de Nginx
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    
    depends_on:
      - web

volumes:
  postgres_data: